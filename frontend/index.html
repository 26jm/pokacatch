<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="공동구매 플랫폼 바닐라 JavaScript 프로토타입" />
    <title>PokaCatch | 공동구매</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./rtl.css" />
    <link rel="stylesheet" href="./design.css" />
    <link rel="stylesheet" href="./member-picker.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#home" aria-label="PokaCatch 홈">Poka-Catch<span>✦</span></a>
      <nav aria-label="주요 메뉴">
        <a href="#home">둘러보기</a>
        <a href="#seller">판매자</a>
      </nav>
      <div class="header-actions">
        <label class="sr-only" for="role-select">데모 역할</label>
        <select id="role-select" aria-label="데모 역할 선택">
          <option value="CUSTOMER">고객</option>
          <option value="SELLER">판매자</option>
          <option value="ADMIN">관리자</option>
        </select>
        <label class="sr-only" for="language-select">언어 선택</label>
        <select id="language-select" aria-label="언어 선택">
          <option value="ko">한국어</option>
          <option value="en">English</option>
          <option value="ar">العربية</option>
        </select>
        <button class="icon-button header-icon" type="button" aria-label="알림">🔔</button>
        <button id="cart-button" class="button button-secondary" type="button">장바구니 <span id="cart-count">0</span></button>
      </div>
    </header>

    <main id="home" class="page-shell">
      <section class="hero">
        <p class="eyebrow">GROUP BUYING</p>
        <h1>함께 모여 더 좋은 가격으로.</h1>
        <p>안전하게 인증된 공구를 찾아, 최애 멤버 1~3지망을 선택하고 함께 참여하세요.</p>
      </section>

      <section class="panel" aria-labelledby="search-title">
        <div class="section-heading"><div><p class="eyebrow">SEARCH</p><h2 id="search-title">진행 중인 공동구매</h2></div><span id="result-summary" class="muted"></span></div>
        <form id="search-form" class="filter-bar">
          <label>검색어<input id="keyword" name="keyword" type="search" placeholder="아티스트명, 앨범명, 멤버 이름 검색" /></label>
          <label>카테고리<select id="category" name="category"><option value="ALL">전체</option></select></label>
          <label>정렬<select id="sort-by" name="sort_by"><option value="popular">인기순</option><option value="deadline">마감 임박순</option><option value="price">낮은 가격순</option></select></label>
          <button class="button" type="submit">검색</button>
        </form>
        <div id="product-grid" class="product-grid" aria-live="polite"></div>
      </section>

      <section class="panel" aria-labelledby="recommendation-title">
        <div class="section-heading"><div><p class="eyebrow">FOR YOU</p><h2 id="recommendation-title">맞춤 추천</h2></div><p class="muted">카테고리 선호도 · 인기 · 마감 임박도를 반영합니다.</p></div>
        <div id="recommendation-grid" class="product-grid"></div>
      </section>

      <section id="seller" class="panel seller-panel" aria-labelledby="seller-title">
        <div class="section-heading"><div><p class="eyebrow">SELLER</p><h2 id="seller-title">판매자 대시보드</h2></div><span id="seller-access" class="status"></span></div>
        <div id="seller-content"></div>
      </section>
    </main>

    <dialog id="cart-dialog" aria-labelledby="cart-title">
      <div class="dialog-heading"><h2 id="cart-title">장바구니</h2><button class="icon-button" data-close-dialog aria-label="닫기">×</button></div>
      <div id="cart-items"></div>
      <div class="cart-footer"><strong>합계 <span id="cart-total">₩0</span></strong><button id="checkout-button" class="button" type="button">결제 진행</button></div>
    </dialog>

    <template id="product-template">
      <article class="product-card"><div class="product-image" aria-hidden="true"></div><div class="product-body"><div class="product-meta"><span class="category-badge"></span><span class="deadline"></span></div><h3></h3><p class="tags"></p><p class="price"></p><div class="progress-copy"></div><div class="progress-track"><span></span></div><fieldset class="member-picker"><legend>멤버 지망 선택</legend><label>1지망<select class="member-select" data-rank="1"><option value="">선택</option></select></label><label>2지망<select class="member-select" data-rank="2"><option value="">선택</option></select></label><label>3지망<select class="member-select" data-rank="3"><option value="">선택</option></select></label></fieldset><button class="button join-button" type="button">지망 선택 후 담기</button></div></article>
    </template>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
